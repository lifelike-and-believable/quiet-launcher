<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Launcher</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<main class="safe">
  <div class="top" role="toolbar" aria-label="Launcher">
    <label class="pill search">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><circle cx="17" cy="17" r="12" fill="none" stroke="currentColor" stroke-width="5"/><line x1="26" y1="26" x2="37" y2="37" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search for a show" aria-label="Search for a show" autocomplete="off" data-row="top" data-nav>
    </label>
    <div class="spacer"></div>
    <button class="pill" id="edit" type="button" data-row="top" data-nav>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      Edit services
    </button>
    <button class="pill" id="browse" type="button" data-row="top" data-nav>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2.2"/></svg>
      Back to browsing
    </button>
    <div class="clock" id="clock" aria-label="Time"></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <section id="services" aria-label="Your services"></section>
</main>
<div class="hint" id="hint"></div>
<script type="module" src="launcher.js"></script>
</body>
</html>
