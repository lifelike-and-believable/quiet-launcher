<!doctype html>
<!-- Mock-up source for docs/design/home-screen.md. Each state is selected by the URL hash
     (mockup.html#default, #search-focus, ...) and rendered at 1920x1080 by render.sh.
     App tiles are coloured placeholders with the app's name: the real screen shows each app's own
     banner artwork. Placeholder colours are not part of the design and were not contrast-checked. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiet home mock-up</title>
<style>
  :root {
    --bg: #101418; --surface: #1c2228; --edge: #59646e; --text: #eef2f5; --muted: #a9b4bd;
    --focus: #ffffff; --ring: #000000; --accent: #8ab4f8; --note: #ffd28a;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", Roboto, sans-serif; position: relative; }
  .safe { position: absolute; inset: 54px 96px; }
  .top { display: flex; align-items: center; gap: 24px; min-height: 96px; }
  .pill { min-height: 88px; border-radius: 44px; background: var(--surface); border: 2px solid var(--edge);
          display: flex; align-items: center; gap: 16px; padding: 0 32px; font-size: calc(32px * var(--scale)); }
  .search { flex: 0 0 680px; color: var(--muted); }
  .search.typed { color: var(--text); }
  .caret { display: inline-block; width: 3px; height: 40px; background: var(--text); vertical-align: middle; margin-left: 2px; }
  .spacer { flex: 1; }
  .clock { font-size: calc(48px * var(--scale)); font-weight: 300; letter-spacing: 1px; }
  .focused { outline: 5px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 11px var(--ring);
             background: #2b343c; color: var(--text); border-color: transparent; transform: scale(1.04); }
  .status { height: 56px; display: flex; align-items: center; padding-left: 36px; font-size: calc(28px * var(--scale)); color: var(--note); }
  .viewport { height: 812px; overflow: hidden; position: relative; padding: 16px 24px 0; margin: 0 -24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 300px); column-gap: 57px; row-gap: 30px; }
  .tile { width: 300px; }
  .banner { width: 300px; height: 169px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 700; color: #fff; text-align: center; padding: 0 16px; }
  .banner.icon { background: var(--surface) !important; }
  .banner.icon span { width: 110px; height: 110px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .name { margin-top: 10px; font-size: calc(28px * var(--scale)); color: var(--muted); text-align: center;
          line-height: 1.2; max-height: calc(2 * 1.2em); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tile.focused { outline: none; box-shadow: none; background: none; transform: none; }
  .tile.focused .banner { outline: 5px solid var(--focus); outline-offset: 3px; box-shadow: 0 0 0 12px var(--ring); transform: scale(1.06); }
  .tile.focused .name { color: var(--text); font-weight: 600; }
  .more { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 26px; color: var(--muted); }
  .keyboard { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: #2a2f35; border-top: 2px solid #3a4148;
              display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; color: var(--muted); font-size: 28px; }
  .keys { display: grid; grid-template-columns: repeat(10, 110px); gap: 12px; }
  .keys div { height: 70px; background: #3a4148; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 28px; }
  .keys div.k-focus { outline: 4px solid var(--focus); }
  .keys div.k-search { background: var(--accent); color: #0b1a33; font-weight: 700; grid-column: span 2; }
  .overlay { position: absolute; inset: 0; background: rgba(16,20,24,.86); display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 36px; font-size: 44px; }
  .spinner { width: 96px; height: 96px; border-radius: 50%; border: 10px solid #3a4148; border-top-color: var(--accent); }
  .overlay small { font-size: 30px; color: var(--muted); }
  .empty { margin-top: 200px; text-align: center; font-size: 36px; color: var(--muted); line-height: 1.6; }
  .label { position: absolute; right: 24px; bottom: 12px; font-size: 20px; color: #8a96a0; }
  svg.mic { width: 30px; height: 40px; }
  svg.gear { width: 36px; height: 36px; }
  svg.glass { width: 40px; height: 40px; }
</style>
</head>
<body>
<div class="safe">
  <div class="top">
    <div class="pill search" id="search">
      <svg class="glass" viewBox="0 0 40 40" aria-hidden="true"><circle cx="17" cy="17" r="12" fill="none" stroke="currentColor" stroke-width="5"/><line x1="26" y1="26" x2="37" y2="37" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      <span id="searchText">Search for a show</span>
    </div>
    <div class="pill" id="voice">
      <svg class="mic" viewBox="0 0 30 40" aria-hidden="true"><rect x="8" y="2" width="14" height="22" rx="7" fill="currentColor"/><path d="M3 18a12 12 0 0 0 24 0" fill="none" stroke="currentColor" stroke-width="3"/><line x1="15" y1="30" x2="15" y2="38" stroke="currentColor" stroke-width="3"/></svg>
      Voice search
    </div>
    <div class="spacer"></div>
    <div class="pill" id="googletv">
      <svg class="gear" viewBox="0 0 36 36" aria-hidden="true"><rect x="3" y="7" width="30" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="3.5"/><line x1="12" y1="31" x2="24" y2="31" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
      Google TV
    </div>
    <div class="pill" id="settings">
      <svg class="gear" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="6" fill="none" stroke="currentColor" stroke-width="4"/><g stroke="currentColor" stroke-width="4" stroke-linecap="round"><line x1="18" y1="2" x2="18" y2="8"/><line x1="18" y1="28" x2="18" y2="34"/><line x1="2" y1="18" x2="8" y2="18"/><line x1="28" y1="18" x2="34" y2="18"/><line x1="6.7" y1="6.7" x2="10.9" y2="10.9"/><line x1="25.1" y1="25.1" x2="29.3" y2="29.3"/><line x1="6.7" y1="29.3" x2="10.9" y2="25.1"/><line x1="25.1" y1="10.9" x2="29.3" y2="6.7"/></g></svg>
      Settings
    </div>
    <div class="clock" id="clock">8:25</div>
  </div>
  <div class="status" id="status"></div>
  <div class="viewport" id="viewport"><div class="grid" id="grid"></div></div>
</div>
<div class="label" id="label"></div>
<script>
  // The reference device's apps in their real install order (2026-11-09), Play Store last.
  const apps = [
    ['YouTube', '#c4302b'], ['Netflix', '#b20710'], ['Disney+', '#113ccf'], ['Spotify', '#127a3a'],
    ['Apple TV', '#3a3a3c'], ['Criterion Channel', '#333'], ['Vimeo', '#0a7fb5'], ['CBC News', '#c8102e'],
    ['CTV', '#4a4a4a'], ['STACKTV', '#2a2a2a'], ['VLC', '#c56f00', 'icon'], ['TuneIn Radio', '#0e6f6a'],
    ['MUBI', '#222'], ['Prime Video', '#1a73e8'], ['ExpressVPN', '#b3262d'], ['Tubi', '#6c2bd9'],
    ['Plex', '#282a2d'], ['myfilmfriend', '#0b6fb8'], ['Google Play Store', '#01875f', 'icon'],
  ];
  const state = (location.hash || '#default').slice(1);
  if (state === 'large-text') document.documentElement.style.setProperty('--scale', '1.3');
  const grid = document.getElementById('grid');
  const list = state === 'empty' ? [] : apps;
  list.forEach(([name, colour, kind], i) => {
    const t = document.createElement('div'); t.className = 'tile'; t.id = 'app' + i;
    const b = document.createElement('div'); b.className = 'banner' + (kind === 'icon' ? ' icon' : '');
    b.style.background = colour;
    b.innerHTML = kind === 'icon' ? `<span style="background:${colour}">${name.length <= 3 ? name : name.split(" ").map(w => w[0]).join("")}</span>` : name;
    const n = document.createElement('div'); n.className = 'name'; n.textContent = name;
    t.append(b, n); grid.append(t);
  });
  const vp = document.getElementById('viewport');
  const focus = id => document.getElementById(id)?.classList.add('focused');
  const status = t => document.getElementById('status').textContent = t;
  const moreBelow = () => {}; // the next row's banners, peeking in at the bottom, are the cue
  const labels = {
    'default': 'Default: Home shows the top, first app selected',
    'search-focus': 'Search for a show selected',
    'keyboard': 'Typing: the TV’s own keyboard, with its Search key',
    'searching': 'Searching: after Search, until Google’s search screen opens',
    'search-failed': 'Google’s search did not open after 10 seconds',
    'many-apps': 'Last row selected: the grid has scrolled one row',
    'offline': 'No internet connection',
    'large-text': 'Largest system text size (1.3x)',
    'empty': 'No apps (unlikely)',
    'voice-focus': 'Voice search selected',
    'settings-focus': 'Settings selected',
    'googletv-focus': 'Google TV selected',
  };
  document.getElementById('label').textContent = 'Mock-up — ' + (labels[state] || state);
  if (['default', 'offline'].includes(state)) { focus('app0'); moreBelow(); }
  if (state === 'search-focus') { focus('search'); moreBelow(); }
  if (state === 'voice-focus') { focus('voice'); moreBelow(); }
  if (state === 'settings-focus') { focus('settings'); moreBelow(); }
  if (state === 'googletv-focus') { focus('googletv'); moreBelow(); }
  if (state === 'many-apps') {
    focus('app17');
    grid.style.transform = 'translateY(-243px)';
  }
  if (state === 'large-text') { focus('app0'); }
  if (state === 'offline') status('No internet connection. Search and voice search need it; your apps still open.');
  if (state === 'keyboard' || state === 'searching' || state === 'search-failed') {
    document.getElementById('search').classList.add('typed');
    document.getElementById('searchText').innerHTML = state === 'keyboard' ? 'Sever<span class="caret"></span>' : 'Severance';
    focus('search'); moreBelow();
  }
  if (state === 'keyboard') {
    const keys = 'qwertyuiopasdfghjkl⌫zxcvbnm.␣'.split('');
    document.body.insertAdjacentHTML('beforeend',
      '<div class="keyboard"><div>The TV’s own keyboard (Gboard for TV); its look is Google’s. The box asks for a Search key.</div><div class="keys">' +
      keys.map(k => `<div class="${k === 'a' ? 'k-focus' : ''}">${k}</div>`).join('') + '<div class="k-search">Search</div></div></div>');
  }
  if (state === 'searching') {
    document.body.insertAdjacentHTML('beforeend',
      '<div class="overlay"><div class="spinner"></div><div>Searching for “Severance”…</div>' +
      '<small>Google’s search will open in a moment. Back cancels.</small></div>');
  }
  if (state === 'search-failed') status('Google’s search did not open. Press select to try again.');
  if (state === 'empty') {
    vp.innerHTML = '<div class="empty">No apps to show.<br>Apps installed on this TV appear here.</div>';
    focus('search');
  }
</script>
</body>
</html>
